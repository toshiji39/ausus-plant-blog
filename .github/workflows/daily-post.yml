name: Daily blog post

on:
  schedule:
    - cron: "17 22 * * *" # 22:17 UTC ≈ 07:17 JST（毎時ちょうどは混雑して遅延・スキップされやすいため少しずらす）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_post.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts _data
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Add daily post $(date -u +%F)"
          git push
