  </defs>
  <rect width="800" height="400" rx="28" fill="url(#grad)"/>

  <!-- big gear -->
  <g fill="#ffffff">
    <rect x="289" y="113" width="22" height="30" rx="4" transform="rotate(0 300 210)"/>
