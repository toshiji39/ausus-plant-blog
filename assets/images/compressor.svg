<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="28" fill="url(#grad)"/>

  <!-- tank -->
  <rect x="300" y="120" width="140" height="200" rx="20" fill="#ffffff" opacity="0.95"/>
  <rect x="300" y="120" width="140" height="200" rx="20" fill="none" stroke="#0f766e" stroke-width="4" opacity="0.4"/>
  <rect x="330" y="150" width="80" height="10" rx="5" fill="#0f766e" opacity="0.35"/>
  <rect x="330" y="175" width="80" height="10" rx="5" fill="#0f766e" opacity="0.35"/>
  <rect x="330" y="200" width="80" height="10" rx="5" fill="#0f766e" opacity="0.35"/>

  <!-- legs -->
  <rect x="310" y="320" width="16" height="30" rx="4" fill="#ffffff"/>
  <rect x="414" y="320" width="16" height="30" rx="4" fill="#ffffff"/>

  <!-- gauge -->
  <circle cx="370" cy="95" r="30" fill="#ffffff"/>
  <circle cx="370" cy="95" r="30" fill="none" stroke="#0f766e" stroke-width="4"/>
  <line x1="370" y1="95" x2="385" y2="80" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="370" cy="95" r="3" fill="#0f766e"/>

  <!-- pipe out -->
  <rect x="440" y="200" width="120" height="18" rx="9" fill="#ffffff"/>
  <circle cx="565" cy="209" r="16" fill="#ffffff"/>
  <circle cx="565" cy="209" r="7" fill="#0f766e" opacity="0.5"/>

  <!-- pipe in -->
  <rect x="240" y="240" width="60" height="18" rx="9" fill="#ffffff" opacity="0.9"/>
</svg>
